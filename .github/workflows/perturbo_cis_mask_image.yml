name: Build and publish combined PerTurbo image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - perturbo-v2-cis-mask-image
    paths:
      - "docker-images/perturbo-v2-cis-mask/**"
      - ".github/workflows/perturbo_cis_mask_image.yml"

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out CRISPR Pipeline
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}/perturbo
          tags: |
            type=raw,value=v2-cis-mask
          labels: |
            org.opencontainers.image.title=PerTurbo v2 JAX with cis mask
            org.opencontainers.image.description=Logan PerTurbo v2 JAX plus optional local gene-by-element pair masking

      - name: Build combined image for tests
        uses: docker/build-push-action@v6
        with:
          context: docker-images/perturbo-v2-cis-mask
          file: docker-images/perturbo-v2-cis-mask/Dockerfile
          load: true
          tags: perturbo:combined-ci
          cache-from: type=gha,scope=perturbo-v2-cis-mask
          cache-to: type=gha,mode=max,scope=perturbo-v2-cis-mask

      - name: Test masked cis and unmasked global behavior
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "io.pinellolab.perturbo.logan-revision" }}' perturbo:combined-ci)" = "39e62c18a64e73b3da3b2c5dba12fda1e7d62e52"
          docker run --rm perturbo:combined-ci sh -ec '
            command -v perturbo
            perturbo --help | grep -F -- "--gene-by-element-varm-key"
            perturbo --help | grep -F -- "--gene-by-element-names-uns-key"
            python -c "import perturbo, pyarrow"
            ps -o pid,comm
          '
          docker run --rm \
            -e JAX_PLATFORM_NAME=cpu \
            -v "$GITHUB_WORKSPACE/docker-images/perturbo-v2-cis-mask/test_combined_image.py:/tmp/test_combined_image.py:ro" \
            perturbo:combined-ci \
            python /tmp/test_combined_image.py

      - name: Publish the single combined image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker-images/perturbo-v2-cis-mask
          file: docker-images/perturbo-v2-cis-mask/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=perturbo-v2-cis-mask

      - name: Record published image
        run: |
          {
            echo "### Combined PerTurbo image"
            echo
            echo '```text'
            echo "ghcr.io/${{ steps.repo.outputs.lower }}/perturbo:v2-cis-mask"
            echo "digest=${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
