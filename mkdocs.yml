site_name: CRISPR Pipeline
site_description: Reproducible mapping, QC, guide assignment, and perturbation inference
site_url: https://pinellolab.github.io/CRISPR_Pipeline/
repo_url: https://github.com/pinellolab/CRISPR_Pipeline
repo_name: pinellolab/CRISPR_Pipeline
edit_uri: ""
extra_css:
  - stylesheets/site.css
not_in_nav: /parameters.md
docs_dir: build/docs-site
site_dir: build/site
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Set up:
      - Start here: usage.md
      - Install the dashboard plugin: plugin-installation.md
      - Basic and advanced configuration: configuration.md
      - Example configs and datasets: examples.md
      - Samplesheet: samplesheet.md
      - SeqSpec: seqspec.md
      - Guide and HTO metadata: guide-metadata.md
      - Covariates: samplesheet_covariates.md
  - Run and monitor:
      - Run recipes and Slurm: run-recipes.md
      - Pause, edit, continue: preinference_checkpoint_user_guide.md
      - Execution dashboard: live_wandb_execution_dashboard.md
      - Optional telemetry and troubleshooting: telemetry.md
  - Analysis:
      - QC and filtering: filtering_workflow.md
      - Post Concatenation QC: postconcat_embedding_qc.md
      - Inference and calibration: inference.md
      - Tools and modules: tool-and-module-map.md
  - Outputs:
      - Output files: output.md
      - Real result examples: output-gallery.md
      - Temporary benchmark review: temporary-benchmarks.md
      - MuData fields: mudata_schema.md
      - Flat QC fields: qc_outputs.md
  - Reference:
      - Target-aware gene filter: target_aware_gene_filter.md
      - Guide-mapping QC: guide_mapping_overlap_qc.md
      - Clone and saturation QC: clone_and_saturation_qc.md
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
